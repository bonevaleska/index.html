<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moda Mujer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
}

/* Encabezado */
header{
    background:#d63384;
    color:white;
    text-align:center;
    padding:25px;
}

nav{
    background:#222;
    text-align:center;
    padding:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
    font-weight:bold;
}

nav a:hover{
    color:#ff99cc;
}

/* Banner principal */
.banner{
    background:url('https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=1200') center/cover;
    height:420px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    text-shadow:2px 2px 6px black;
    font-size:45px;
    font-weight:bold;
}

/* Productos */
.contenedor{
    width:90%;
    margin:auto;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:40px 0;
}

.producto{
    width:280px;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 10px rgba(0,0,0,.2);
    transition:.3s;
}

.producto:hover{
    transform:scale(1.05);
}

.producto img{
    width:100%;
    height:320px;
    object-fit:cover;
}

.info{
    padding:15px;
    text-align:center;
}

.precio{
    color:#d63384;
    font-size:24px;
    font-weight:bold;
    margin:10px 0;
}

button{
    background:#d63384;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#b0256d;
}

/* Banner oferta */
.oferta{
    background:#ff66b2;
    color:white;
    text-align:center;
    padding:30px;
    font-size:30px;
    font-weight:bold;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
}
</style>

</head>
<body>

<header>
<h1>👗 Moda Mujer</h1>
<p>Las últimas tendencias para ti</p>
</header>

<nav>
<a href="#">Inicio</a>
<a href="#">Vestidos</a>
<a href="#">Blusas</a>
<a href="#">Pantalones</a>
<a href="#">Contacto</a>
</nav>

<div class="banner">
Nueva Colección 2026
</div>

<div class="oferta">
🔥 ¡Descuentos del 40% esta semana! 🔥
</div>

<section class="contenedor">

<div class="producto">
<img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=500">
<div class="info">
<h2>Vestido Elegante</h2>
<p class="precio">$39.99</p>
<button>Comprar</button>
</div>
</div>

<div class="producto">
<img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=500">
<div class="info">
<h2>Blusa Casual</h2>
<p class="precio">$24.99</p>
<button>Comprar</button>
</div>
</div>

<div class="producto">
<img src="https://images.unsplash.com/photo-1495385794356-15371f348c31?w=500">
<div class="info">
<h2>Conjunto Moderno</h2>
<p class="precio">$59.99</p>
<button>Comprar</button>
</div>
</div>

</section>

<footer>
© 2026 Moda Mujer | Tienda Online
</footer>

</body>
</html>
